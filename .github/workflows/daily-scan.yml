name: Daily breakout scan

on:
  schedule:
    # 12:30 UTC = 7:30am US/Eastern (8:30am during EST) - weekday mornings,
    # before the US market open. Adjust if your timezone/target differs.
    - cron: "30 12 * * 1-5"
  workflow_dispatch: {} # manual "Run workflow" button, used for Phase 6 verification

permissions:
  contents: write # needed to commit the day's results back to the repo
                  # (also requires Settings > Actions > General > Workflow
                  # permissions = "Read and write permissions" - see README.md)

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        # Script filename: stock_scanner.py (repo root)
        # Output path: frontend/public/data/latest.csv - this is what
        # frontend/src/App.jsx fetches on load (DATA_URL), and it lives
        # under frontend/public/ so `npm run build` bundles it into
        # dist/data/latest.csv automatically. See Phase 4/README.md.
        run: python stock_scanner.py --out frontend/public/data/latest.csv

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/latest.csv frontend/public/data/archive/ 2>/dev/null || true
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Daily scan: $(date -u +%Y-%m-%d)"
          git push
