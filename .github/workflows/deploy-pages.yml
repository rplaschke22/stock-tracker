name: Deploy frontend to GitHub Pages

# Only relevant if you chose GitHub Pages as the deploy target (see
# README.md "Deployment" section for the GitHub Pages vs Vercel
# tradeoff). If you deploy via Vercel instead, Vercel's own GitHub
# integration handles rebuilds on push and this workflow is unused -
# you can delete it or just leave it disabled.
#
# Runs on every push to main (including the daily-scan.yml commit that
# updates frontend/public/data/latest.csv), so the live site picks up
# each day's scan automatically, plus workflow_dispatch for manual runs.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
